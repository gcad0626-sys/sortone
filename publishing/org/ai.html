<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SortOne - AI 자동분류</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="ai.css" />
  <link rel="stylesheet" href="sidebar.css" />
</head>

<body>
  <div class="app">

    <!-- 상단 헤더 -->
    <header class="header">
      <div class="header__left">
        <button class="header__icon-btn" type="button" aria-label="메뉴">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <span class="header__logo">SortOne</span>
      </div>
      <div class="header__right">
        <button class="header__icon-btn" type="button" aria-label="검색" onclick="location.href='search.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
        <span class="header__avatar" style="cursor:pointer;" onclick="location.href='profile.html'">IY</span>
      </div>
    </header>

    <!-- AI 자동분류 상세 화면 -->
    <main class="screen">
      <div class="screen__scroll">
        <div class="ai-content">

          <!-- Weekly Insight 카드 -->
          <div class="insight-card">
            <span class="insight-card__label" id="insightLabel"></span>
            <h2 class="insight-card__title" id="insightTitle"></h2>
            <p class="insight-card__desc" id="insightDesc"></p>
            <div class="insight-card__stats">
              <div class="insight-stat">
                <span class="insight-stat__label">작성된 메모</span>
                <span class="insight-stat__value" id="memoCountValue">0개</span>
              </div>
              <div class="insight-stat">
                <span class="insight-stat__label">분석 효율</span>
                <span class="insight-stat__value is-positive" id="efficiencyValue">+0%</span>
              </div>
            </div>
          </div>

          <!-- 분석 현황 -->
          <section class="ai-section">
            <div class="ai-section__header">
              <span class="ai-section__title">분석 현황</span>
              <div class="ai-section__more-wrap">
                <button class="ai-section__more" type="button" aria-label="더보기" id="analysisMoreBtn">&#8942;</button>
                <div class="sort-dropdown" id="analysisDropdown">
                  <button class="sort-dropdown__item is-active" data-sort="latest" type="button">최신 등록순</button>
                  <button class="sort-dropdown__item" data-sort="oldest" type="button">오래된순</button>
                  <button class="sort-dropdown__item" data-sort="inprogress" type="button">분석 중 먼저</button>
                  <button class="sort-dropdown__item" data-sort="done" type="button">완료된 항목 먼저</button>
                  <div class="sort-dropdown__divider"></div>
                  <button class="sort-dropdown__item sort-dropdown__item--reset" data-sort="reset" type="button">삭제된 항목 복원</button>
                </div>
              </div>
            </div>
            <div class="ai-list" id="analysisList"></div>
          </section>

          <!-- 실행 항목 -->
          <section class="ai-section">
            <div class="ai-section__header">
              <span class="ai-section__title">실행 항목</span>
              <div class="ai-section__more-wrap">
                <button class="ai-section__more" type="button" aria-label="더보기" id="actionMoreBtn">&#8942;</button>
                <div class="sort-dropdown" id="actionDropdown">
                  <button class="sort-dropdown__item" data-action="reset-hidden" type="button">삭제항목 복원</button>
                  <button class="sort-dropdown__item sort-dropdown__item--reset" data-action="reset-checked" type="button">완료 항목 초기화</button>
                </div>
              </div>
            </div>
            <div class="ai-list" id="actionList"></div>
          </section>

        </div>
      </div>

      <!-- 메모 추가 버튼 -->
      <button class="fab" id="fabAddBtn" type="button" aria-label="메모 추가">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    </main>

    <!-- 하단 탭바 -->
    <nav class="tabbar">
      <a class="tabbar__item" href="index.html">
        <img src="Book.png" alt="Memo" />
        Memo
      </a>
      <a class="tabbar__item is-active" href="ai.html">
        <img src="cat.png" alt="Ai" />
        Ai
      </a>
      <a class="tabbar__item" href="search.html">
        <img src="Search.png" alt="Search" />
        Search
      </a>
      <a class="tabbar__item" href="profile.html">
        <img src="Key.png" alt="Profile" />
        Profile
      </a>
    </nav>

    <!-- 햄버거 메뉴 (사이드 드로어, 공통 오버레이 컴포넌트) -->
    <div class="sidebar-overlay" id="sidebarOverlay">
      <div class="sidebar-drawer" id="sidebarDrawer">

        <div class="sidebar-profile">
          <img class="sidebar-profile__avatar" id="sidebarAvatar" src="" alt="프로필 사진" />
          <div class="sidebar-profile__info">
            <div class="sidebar-profile__name-row">
              <span class="sidebar-profile__name" id="sidebarName"></span>
              <span class="sidebar-profile__badge" id="sidebarBadge"></span>
            </div>
            <span class="sidebar-profile__email" id="sidebarEmail"></span>
          </div>
        </div>

        <nav class="sidebar-menu">
          <button class="sidebar-menu__item" type="button" data-category="전체">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M14 3v4a1 1 0 0 0 1 1h4" />
              <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z" />
              <line x1="9" y1="13" x2="15" y2="13" />
              <line x1="9" y1="17" x2="13" y2="17" />
            </svg>
            전체 메모
          </button>
          <button class="sidebar-menu__item" type="button" data-category="개인">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            개인
          </button>
          <button class="sidebar-menu__item" type="button" data-category="업무">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" />
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            </svg>
            업무
          </button>
          <button class="sidebar-menu__item" type="button" data-category="아이디어">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M9 18h6" />
              <path d="M10 22h4" />
              <path d="M12 2a6 6 0 0 0-4 10.5c.6.5 1 1.3 1 2.5h6c0-1.2.4-2 1-2.5A6 6 0 0 0 12 2z" />
            </svg>
            아이디어
          </button>
        </nav>

        <div class="sidebar-divider"></div>

        <nav class="sidebar-menu">
          <button class="sidebar-menu__item" type="button" data-todo="보관함">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="21 8 21 21 3 21 3 8" />
              <rect x="1" y="3" width="22" height="5" />
              <line x1="10" y1="12" x2="14" y2="12" />
            </svg>
            보관함
          </button>
          <button class="sidebar-menu__item" type="button" data-todo="휴지통">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
            </svg>
            휴지통
          </button>
        </nav>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-footer">
          <button class="sidebar-menu__item sidebar-menu__item--danger" type="button" id="sidebarLogoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            로그아웃
          </button>
        </div>

      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="sidebar.js"></script>
  <script src="ai.js"></script>
</body>

</html>
