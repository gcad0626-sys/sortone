<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SortOne - 로그인</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="app">

    <div class="login-screen">

      <p class="login-catchphrase">생각을 명확한 인사이트로<br />바꾸세요.</p>

      <div class="login-spacer"></div>

      <div class="login-buttons">
        <button class="social-btn social-btn--kakao" id="kakaoLoginBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 3C6.48 3 2 6.48 2 10.8c0 2.76 1.83 5.18 4.6 6.56-.2.73-.73 2.66-.84 3.07-.13.5.18.5.39.36.16-.11 2.6-1.77 3.66-2.49.72.1 1.46.16 2.19.16 5.52 0 10-3.48 10-7.8C22 6.48 17.52 3 12 3z" />
          </svg>
          카카오로 계속하기
        </button>
        <button class="social-btn social-btn--google" id="googleLoginBtn" type="button">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46c-.28 1.5-1.13 2.77-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.81z" />
            <path fill="#34A853"
              d="M12 24c3.24 0 5.96-1.07 7.94-2.92l-3.88-3c-1.08.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.94H1.28v3.1C3.25 21.3 7.31 24 12 24z" />
            <path fill="#FBBC05"
              d="M5.29 14.29A7.2 7.2 0 0 1 4.91 12c0-.8.14-1.57.38-2.29v-3.1H1.28A11.98 11.98 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39z" />
            <path fill="#EA4335"
              d="M12 4.77c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.28 6.61l4.01 3.1C6.23 6.88 8.88 4.77 12 4.77z" />
          </svg>
          Google 계정으로 계속하기
        </button>
      </div>

      <div class="login-divider"><span>또는</span></div>

      <div class="login-links">
        <a class="login-links__signup" id="emailSignupLink" href="signup.html">이메일로 가입하기</a>
        <span class="login-links__signin">이미 계정이 있으신가요? <a id="signinLink" href="login.html">로그인</a></span>
      </div>

    </div>

  </div>

  <script src="login.js?v=2"></script>
</body>

</html>
